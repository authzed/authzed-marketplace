---
# Caveats (Attribute-Based Access Control / ABAC)
# Pattern: Dynamic, context-aware permissions evaluated at check time
# Source: https://github.com/authzed/examples/tree/main/schemas/caveats
#
# Use this as a starting point when you need:
# - IP allowlist enforcement
# - Rate-limited access
# - Any permission that depends on data only available at check time (not stored as a relationship)
# See also: spicedb-schema-design SKILL.md "When to Use Caveats" section

schema: |-
  /**
   * an entity that can be granted permissions
   */
  definition user {}

  /**
   * a resource that we are trying to protect
   */
  definition document {
    /**
     * users can be made readers of specific documents,
     * either directly, or only if they're connecting from an approved
     * office network, or only if they aren't rate limited.
     */
    relation reader: user | user with from_office_network | user with not_rate_limited

    /**
     * if a user has the reader relationship to a specific document,
     * they automatically get permission to view it
     */
    permission view = reader
  }

  /**
   * only allowed if the connection is coming from within the office's
   * registered subnet.
   * office_subnet is provided when writing the relation; connecting_from
   * is provided at CheckPermission time.
   */
  caveat from_office_network(connecting_from ipaddress, office_subnet string) {
    connecting_from.in_cidr(office_subnet)
  }

  /**
   * only allowed if rate limits haven't been exceeded.
   * allowed_max is provided when writing the relation; current is provided
   * at CheckPermission time.
   */
  caveat not_rate_limited(allowed_max int, current int) {
    current < allowed_max
  }

relationships: |-
  document:firstdoc#reader@user:fred
  document:firstdoc#reader@user:tom[not_rate_limited:{"allowed_max":100}]
  document:firstdoc#reader@user:alice[from_office_network:{"office_subnet":"10.20.30.0/24"}]

assertions:
  assertTrue:
    - 'document:firstdoc#view@user:tom with {"current": 1}'
    - "document:firstdoc#view@user:fred"
    - 'document:firstdoc#view@user:alice with {"connecting_from": "10.20.30.9"}'
  assertCaveated:
    - "document:firstdoc#view@user:tom"
    - "document:firstdoc#view@user:alice"
  assertFalse:
    - 'document:firstdoc#view@user:tom with {"current": 500}'
    - 'document:firstdoc#view@user:alice with {"connecting_from": "203.0.113.5"}'

validation:
  document:firstdoc#view:
    - "[user:fred] is <document:firstdoc#reader>"
    - "[user:tom[...]] is <document:firstdoc#reader>"
    - "[user:alice[...]] is <document:firstdoc#reader>"
  document:seconddoc#view: []
