---
# Superuser / Platform Admin
# Pattern: Root platform object whose admins inherit permissions on all downstream resources
# Source: https://github.com/authzed/examples/tree/main/schemas/superuser
#
# Use this as a starting point when you need:
# - A platform-level super_admin role that bypasses normal access controls
# - Resources owned by organizations, where org permissions come from the platform
# - Propagating admin rights down a hierarchy: platform -> organization -> resource
#
# Key insight: Rather than checking two separate things (is user an org admin? is user a platform admin?),
# model the platform admin permission as flowing into organization#admin, which flows into resource permissions.
# This means a platform admin automatically has admin on every org and every resource without
# writing explicit relationships.

schema: |-
  /**
   * an entity that can be granted permissions
   */
  definition user {}

  /**
   * a resource that we are trying to protect
   */
  definition document {
    /**
     * a specific user or a specific organization can be made owner of a
     * document
     */
    relation owner: user | organization

    /**
     * if a user has the (direct) owner relation OR if they are admin of the
     * owner organization, they get the admin permission on the document
     */
    permission admin = owner + owner->admin
  }

  /**
   * organizations can own documents
   */
  definition organization {
    /**
     * the organization can be linked to one platform
     */
    relation platform: platform

    /**
     * if a user has the super_admin permission on the platform, they get the
     * admin permission on the organization
     */
    permission admin = platform->super_admin
  }

  /**
   * a root object whose administrators have super-admin access to everything
   */
  definition platform {
    relation administrator: user
    permission super_admin = administrator
  }

relationships: |-
  platform:evilempire#administrator@user:drevil
  organization:virtucon#platform@platform:evilempire
  document:lasers#owner@organization:virtucon

assertions:
  assertTrue:
    - "document:lasers#admin@user:drevil"
  assertFalse: null

validation: null
